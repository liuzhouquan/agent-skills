<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Studio · 简历工作台</title><link rel="stylesheet" href="/app.css">
<header><div><strong>Resume Studio</strong><span>简历工作台</span></div><nav><button id="save">保存</button><button id="archive">存档当前版本</button><button id="export-draft">导出完整档案</button><button id="import">导入内容</button><button id="json">导出内容</button><button id="html">导出 HTML</button><button id="print">打印 / PDF</button><input id="file" type="file" accept=".json" hidden></nav></header>
<main><aside class="editor"><h1>写下你的经历</h1><p class="hint">文字保持纯粹，排版交给模板。</p><details id="library-panel" open><summary>我的简历库</summary><label for="document-list">切换简历</label><select id="document-list"></select><div class="library-actions"><button id="new-document">新建简历</button><button id="copy-document">复制当前稿</button><button id="rename-document">重命名</button></div><label for="version-list">切换到存档（会切换简历、候选稿和对话）</label><select id="version-list"></select><p class="hint" id="storage-location"></p></details><details id="paste-panel"><summary>粘贴内容，让 Agent 整理</summary><p class="hint">直接粘贴旧简历、Markdown 或零散经历，无需自己分字段。</p><label for="source-text">原始内容</label><textarea id="source-text" rows="10" placeholder="粘贴你的简历或项目经历…"></textarea><label for="paste-mode">整理方式</label><select id="paste-mode"><option value="replace">生成新简历</option><option value="merge">合并到当前简历</option></select><label for="paste-goal">调整要求（可选）</label><textarea id="paste-goal" rows="2" placeholder="例如：申请后端实习，精简到一页"></textarea><button id="organize">让 Agent 整理</button></details><div id="fields"></div><button id="add-section">添加章节</button></aside>
<section class="preview"><div class="toolbar"><label>模板 <select id="template"></select></label><label>间距 <select id="density"><option value="comfortable">舒展</option><option value="compact">紧凑</option></select></label><span id="status" role="status">正在载入</span></div><div class="paper" id="paper"><iframe title="简历预览" id="preview" sandbox="allow-same-origin allow-modals"></iframe><div id="comparison" hidden><article><h3>当前版本</h3><iframe title="当前简历版本" id="current-preview" sandbox="allow-same-origin"></iframe></article><article><h3>候选版本</h3><iframe title="候选简历版本" id="candidate-preview" sandbox="allow-same-origin"></iframe></article></div></div></section>
<aside class="agent"><h2>一起打磨简历</h2><p class="hint">网页中的 Agent 通过本机 Codex CLI 调用，候选稿确认后才会应用。</p><p id="connection" role="status">正在读取 Codex 状态…</p><button id="check-connection">检查连接</button><div id="messages" aria-live="polite"></div><label for="model">本机 Codex 可用模型</label><select id="model"></select><p class="model-note" id="model-note">模型列表来自本机 Codex CLI，与当前 ChatGPT 对话使用的模型分别配置。</p><label for="prompt">你想如何修改？</label><textarea id="prompt" rows="5" placeholder="例如：精简项目经历，突出我的个人贡献"></textarea><button id="send"><span class="button-label">发送给 Codex</span><span class="button-spinner" aria-hidden="true"></span></button><div id="candidate" hidden><button id="compare">返回当前稿</button><button id="side-by-side">并排对比</button><button id="apply">应用候选稿</button><button id="discard">放弃候选稿</button></div></aside></main><script src="/app.js"></script></html>
